[package]
name = "reader-desktop"
version = "0.1.0"
default-run = "reader-desktop"
description = "A desktop novel and ebook reader"
authors = ["Reader Desktop"]
edition = "2021"

[lib]
name = "reader_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[dependencies]
tauri = { version = "2.8", features = [] }
tauri-plugin-dialog = "2.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
thiserror = "2"
encoding_rs = "0.8"
zip = "4"
quick-xml = "0.38"
regex = "1"
fancy-regex = "0.16"
# gzip/brotli/deflate/zstd are not optional niceties: without them reqwest
# sends no Accept-Encoding at all, which next to a Chrome User-Agent is one
# more inconsistency for Cloudflare's bot detection to score against us.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "cookies", "socks", "blocking", "gzip", "brotli", "deflate", "zstd"] }
sha2 = "0.10"
md-5 = "0.10"
scraper = "0.22"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
futures = "0.3"
async-trait = "0.1"
rquickjs = { version = "0.9", features = ["macro"] }
urlencoding = "2"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
