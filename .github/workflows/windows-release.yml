# =============================================================================
# Reader Desktop —— Windows 构建 + GitHub Release
#
# 触发：
#   * 推送 main              → 构建 Windows 版并发布 Release
#   * 手动 workflow_dispatch → 只构建（可在非 main 分支上试跑），产物见 Artifacts
#
# 沿用仓库既有约定：
#   * src-tauri/tauri.conf.json 的 version 是版本号唯一来源
#   * 同文件 bundle.active = false，所以加 --no-bundle，只产出裸 exe
#   * 包管理器是 npm（package-lock.json 已入库，beforeBuildCommand 也是 npm）
# =============================================================================

name: Windows Build & Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# 创建 tag / Release 需要 contents: write
permissions:
  contents: write

# main 上连续推送时，取消尚未跑完的旧任务
concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Build & Release
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      # 必须排在 rust-cache 之前：缓存 key 里含 rustc 版本
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      # bundle.active = false，这里再用 --no-bundle 把「只出裸 exe」写死，
      # 免得以后有人打开 bundle 之后 CI 悄悄开始产安装包
      - name: Build Tauri app
        run: npm run tauri -- build --ci --no-bundle

      - name: Compute release tag
        id: version
        shell: pwsh
        run: |
          $conf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $tag  = "v$($conf.version)-build.${{ github.run_number }}"
          "version=$($conf.version)" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "version = $($conf.version)"
          Write-Host "tag     = $tag"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: reader-desktop-windows
          path: src-tauri/target/release/reader-desktop.exe
          if-no-files-found: error
          # workflow 重跑时同名 artifact 会冲突，覆盖掉
          overwrite: true

      - name: Publish GitHub Release
        # 只在 main 上发布；workflow_dispatch 到其它分支时只留 Artifacts
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Reader Desktop ${{ steps.version.outputs.tag }}
          # tag 指到本次构建的那个提交
          target_commitish: ${{ github.sha }}
          files: src-tauri/target/release/reader-desktop.exe
          fail_on_unmatched_files: true
          generate_release_notes: true
          make_latest: 'true'
          body: |
            Windows x64 单文件可执行程序，免安装，双击即可运行。

            - 应用版本：`${{ steps.version.outputs.version }}`
            - 构建提交：`${{ github.sha }}`
            - 构建记录：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

# =============================================================================
# 备注
#
# 1) 免费额度：公开仓库用标准 GitHub 托管 runner 免费且不限分钟（windows-latest
#    是 4 vCPU / 16 GB）；私有仓库在 Free 套餐下每月 2000 分钟，超出后按分钟
#    计费，Windows 单价高于 Linux。
#
# 2) 构建耗时：Swatinem/rust-cache 会缓存 ~/.cargo 与 src-tauri/target，key 含
#    rustc 版本与 Cargo.lock 哈希，所以首次冷编译十几到二十分钟、之后通常几分钟。
#    注意 GitHub 缓存额度是每仓库 10 GB，超出会淘汰最旧的缓存。
#
# 3) tag 形如 v0.1.0-build.42（42 = github.run_number），每次运行都唯一，
#    不会因为 tag 已存在而失败；代价是它不是语义化版本号。
#
# 4) 以后想产出安装包：把 src-tauri/tauri.conf.json 改成
#      "bundle": { "active": true, "targets": ["nsis"] }
#    去掉 --no-bundle，并把两处 exe 路径换成
#      src-tauri/target/release/bundle/nsis/*.exe
# =============================================================================
